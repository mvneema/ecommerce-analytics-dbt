version: 2

models:
  - name: fact_orders
    description: "Fact table containing all order line items with joins to dimensions"
    columns:
      - name: order_key
        description: "Surrogate key for each order line item"
        tests:
          - unique
          - not_null
      
      - name: sale_price
        description: "Price paid by customer"
        tests:
          - not_null
      
      - name: profit
        description: "Profit per item (sale_price - cost)"
        tests:
          - not_null

  - name: dim_users
    description: "User dimension with SCD Type 2 tracking"
    columns:
      - name: user_key
        description: "Surrogate key for user records"
        tests:
          - unique
          - not_null
      
      - name: user_id
        description: "Natural key for users"
        tests:
          - not_null

  - name: dim_products
    description: "Product dimension"
    columns:
      - name: product_key
        description: "Surrogate key for products"
        tests:
          - unique
          - not_null
      
      - name: product_id
        description: "Natural key for products"
        tests:
          - unique
          - not_null